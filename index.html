<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обменник Валют</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>💱 Обменник Валют</h1>
        
        <div class="converter">
            <div class="input-group">
                <label for="amount">Сумма:</label>
                <input type="number" id="amount" placeholder="Введите сумму" value="100">
            </div>
            
            <div class="currency-select">
                <div class="select-group">
                    <label for="fromCurrency">Из валюты:</label>
                    <select id="fromCurrency">
                        <option value="USD">USD - Доллар США</option>
                        <option value="EUR">EUR - Евро</option>
                        <option value="RUB">RUB - Российский рубль</option>
                        <option value="GBP">GBP - Британский фунт</option>
                        <option value="JPY">JPY - Японская йена</option>
                        <option value="CNY">CNY - Китайский юань</option>
                    </select>
                </div>
                
                <button id="swapBtn" title="Поменять местами">⇄</button>
                
                <div class="select-group">
                    <label for="toCurrency">В валюту:</label>
                    <select id="toCurrency">
                        <option value="EUR">EUR - Евро</option>
                        <option value="USD">USD - Доллар США</option>
                        <option value="RUB">RUB - Российский рубль</option>
                        <option value="GBP">GBP - Британский фунт</option>
                        <option value="JPY">JPY - Японская йена</option>
                        <option value="CNY">CNY - Китайский юань</option>
                    </select>
                </div>
            </div>
            
            <button id="convertBtn">Конвертировать</button>
            
            <div class="result" id="result">
                <p>Результат появится здесь</p>
            </div>
            
            <div class="rate-info" id="rateInfo"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
